      <stop offset="100%" stop-color="#0f0f11" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#grid)" />
  
  <!-- Outer Window Frame -->
  <rect x="80" y="60" width="1040" height="630" rx="16" fill="url(#g1)" stroke="#27272a" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <line x1="80" y1="120" x2="1120" y2="120" stroke="#27272a" stroke-width="1.5" />
  <circle cx="120" cy="90" r="5" fill="#3f3f46" />
  <circle cx="140" cy="90" r="5" fill="#27272a" />
  <circle cx="160" cy="90" r="5" fill="#27272a" />
  <text x="600" y="95" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="1">GEEZMART.COMMERCE / STOREFRONT</text>

