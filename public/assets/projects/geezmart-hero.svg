  <text x="150" y="320" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Leather Accessories</text>
  <text x="150" y="360" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Everyday Carry</text>
  <text x="150" y="400" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Studio Hardware</text>
  
