  <text x="400" y="610" fill="#f4f4f5" font-family="'Bricolage Grotesque', sans-serif" font-size="24" font-weight="700">65%</text>
  <text x="400" y="632" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Bounce Reduction</text>

  <line x1="560" y1="585" x2="560" y2="645" stroke="#27272a" stroke-width="1" />
  <text x="600" y="610" fill="#f4f4f5" font-family="'Bricolage Grotesque', sans-serif" font-size="24" font-weight="700">0.7s</text>
  <text x="600" y="632" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Mean Interactive Time</text>

  <line x1="770" y1="585" x2="770" y2="645" stroke="#27272a" stroke-width="1" />
  <text x="810" y="610" fill="#f4f4f5" font-family="'Bricolage Grotesque', sans-serif" font-size="24" font-weight="700">100%</text>
  <text x="810" y="632" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Mobile Optimized</text>
