<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" fill="none">
  <rect width="1200" height="750" fill="#000000" />
  <defs>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <pattern id="dotpattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" />
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#spotlight)" />
  <rect width="1200" height="750" fill="url(#dotpattern)" opacity="0.6" />

  <!-- Frame & Editorial Rule -->
  <rect x="70" y="50" width="1060" height="650" fill="none" stroke="#27272a" stroke-width="1" />
  <rect x="90" y="70" width="1020" height="610" fill="none" stroke="#18181b" stroke-width="1" />

  <!-- Monogram Top Left -->
  <text x="120" y="125" fill="#f4f4f5" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2">02 / EXPERIMENTAL STUDIO</text>
  <text x="1080" y="125" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="end">SYS.REV.2025</text>

  <!-- Big Editorial Typography -->
  <text x="600" y="270" fill="#ffffff" font-family="'Bricolage Grotesque', sans-serif" font-size="88" font-weight="800" text-anchor="middle" letter-spacing="-3">BLACK TIGER</text>
  <text x="600" y="325" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="500" text-anchor="middle" letter-spacing="4">KINETIC DIGITAL JOURNAL &amp; BRAND EXPERIENCE</text>

  <!-- Central Graphic Showcase -->
  <rect x="250" y="370" width="700" height="230" rx="4" fill="#0d0d10" stroke="#3f3f46" stroke-width="1" />
  
  <!-- Stylized Soundwave / Kinetic Lines -->
  <path d="M 280 485 Q 400 400 500 485 T 700 485 T 900 485" fill="none" stroke="#f4f4f5" stroke-width="2" />
  <path d="M 280 485 Q 380 540 520 485 T 750 485 T 920 485" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="6 4" />
  
  <!-- Interactive Cursor Mockup -->
  <circle cx="680" cy="440" r="32" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="680" cy="440" r="4" fill="#ffffff" />
  <text x="725" y="445" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12">DRAG / EXPLORE</text>

  <!-- Meta Badges -->
  <rect x="280" y="395" width="130" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="345" y="412" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">WEBGL SHADER</text>

  <rect x="425" y="395" width="130" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="490" y="412" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">CANVAS AUDIO</text>

  <!-- Editorial Footnote -->
  <text x="120" y="645" fill="#52525b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">CRAFTED FOR SENSORY DEPTH &amp; ART DIRECTION</text>
  <text x="1080" y="645" fill="#52525b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="end">BAYD XN ARCHIVE</text>
</svg>
